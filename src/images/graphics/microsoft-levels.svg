<svg xmlns="http://www.w3.org/2000/svg" class="msft-levels" viewBox="0 0 480 230">
  <style>
    .msft-levels { --title: #4a5565; --bracket: #c9bffc; max-width: 480px; margin-inline: auto; font-family: ui-sans-serif, system-ui, sans-serif; }
    .msft-levels .l59 { --fill: #e0daff; --ink: #3f316c; }
    .msft-levels .l60 { --fill: #c9bffc; --ink: #3f316c; }
    .msft-levels .l61 { --fill: #b1a2f2; --ink: #241b41; }
    .msft-levels .l62 { --fill: #9c89e6; --ink: #241b41; }
    .msft-levels .l63 { --fill: #775dc5; --ink: #fff; }
    .msft-levels .l64 { --fill: #654bad; --ink: #fff; }
    :where(.dark) .msft-levels { --title: #d1d5dc; --bracket: #654bad; }
    :where(.dark) .msft-levels .step { --ink: #f3f4f6; }
    :where(.dark) .msft-levels .l59 { --fill: rgb(156 137 230 / .14); }
    :where(.dark) .msft-levels .l60 { --fill: rgb(156 137 230 / .22); }
    :where(.dark) .msft-levels .l61 { --fill: rgb(156 137 230 / .32); }
    :where(.dark) .msft-levels .l62 { --fill: rgb(156 137 230 / .44); }
    :where(.dark) .msft-levels .l63 { --fill: rgb(156 137 230 / .57); }
    :where(.dark) .msft-levels .l64 { --fill: rgb(156 137 230 / .7); }
    .msft-levels .step rect { fill: var(--fill); }
    .msft-levels .step text { fill: var(--ink); font-size: 17px; font-weight: 700; text-anchor: middle; }
    .msft-levels .title { fill: var(--title); font-size: 15px; font-weight: 600; text-anchor: middle; }
    .msft-levels .bracket { fill: none; stroke: var(--bracket); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <g class="step l59"><rect x="28" y="120" width="64" height="40" rx="8"/><text x="60" y="140" dy=".35em">59</text></g>
  <g class="step l60"><rect x="100" y="100" width="64" height="60" rx="8"/><text x="132" y="121" dy=".35em">60</text></g>
  <g class="step l61"><rect x="172" y="80" width="64" height="80" rx="8"/><text x="204" y="101" dy=".35em">61</text></g>
  <g class="step l62"><rect x="244" y="60" width="64" height="100" rx="8"/><text x="276" y="81" dy=".35em">62</text></g>
  <g class="step l63"><rect x="316" y="40" width="64" height="120" rx="8"/><text x="348" y="61" dy=".35em">63</text></g>
  <g class="step l64"><rect x="388" y="20" width="64" height="140" rx="8"/><text x="420" y="41" dy=".35em">64</text></g>
  <path class="bracket" d="M 31 170 V 174 Q 31 178 35 178 H 157 Q 161 178 161 174 V 170 M 96 178 V 184"/>
  <path class="bracket" d="M 175 170 V 174 Q 175 178 179 178 H 301 Q 305 178 305 174 V 170 M 240 178 V 184"/>
  <path class="bracket" d="M 319 170 V 174 Q 319 178 323 178 H 445 Q 449 178 449 174 V 170 M 384 178 V 184"/>
